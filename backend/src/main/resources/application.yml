server:
  port: 8080

spring:
  application:
    name: novel-ai-writer
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/novel_ai_writer?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456789
  data:
    redis:
      host: localhost
      port: 6379
      #password:
      database: 0
      timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: novel-ai-writer-jwt-secret-key-change-in-production-2024
  expiration: 86400000

# 大模型 API 配置（密钥仅在后端，前端不可见）
llm:
  # 调用本地 Ollama OpenAI兼容接口
  api-url: http://localhost:11434/v1/chat/completions
  api-key: not-needed
  # 修正：和ollama list里的名称完全一致 qwen2.5:1.5b
  model: qwen2.5:1.5b
  max-tokens: 4096
  temperature: 0.8

# 异步线程池
async:
  core-pool-size: 4
  max-pool-size: 8
  queue-capacity: 100
  thread-name-prefix: novel-async-

# 接口限流（每用户每分钟最大请求数）
rate-limit:
  enabled: true
  max-requests: 60
  window-seconds: 60
